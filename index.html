<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0096D6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Doraemon" />
  <meta name="description" content="Doraemon — Your personal AI companion for Sanaa" />
  <title>Doraemon for Sanaa 💙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>

  <!-- Passcode Modal (shown first time / when passcode not set) -->
  <div id="passcode-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">🔐</div>
      <h2 class="modal-title">Enter Passcode</h2>
      <p class="modal-desc">Ask the person who set this up for the passcode!</p>
      <input
        type="password"
        id="passcode-input"
        class="modal-input"
        placeholder="Enter passcode..."
        autocomplete="off"
        enterkeyhint="go"
      />
      <button id="passcode-submit" class="modal-btn">Let's Go! 🚀</button>
      <p id="passcode-error" class="modal-error hidden">Wrong passcode, try again!</p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app">
    <!-- Status bar -->
    <div id="status-bar">
      <div id="status-dot"></div>
      <span id="status-text">Ready</span>
      <button id="clear-btn" title="Clear chat" class="clear-btn" aria-label="Clear conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
      </button>
    </div>

    <!-- Doraemon character area -->
    <div id="character-area">
      <div id="doraemon-container">
        <!-- SVG Doraemon will be injected here by doraemon.js -->
      </div>
      <div id="speech-bubble" class="hidden">
        <span id="speech-text"></span>
      </div>
    </div>

    <!-- Chat area -->
    <div id="chat-area">
      <div id="messages"></div>
    </div>

    <!-- Input area -->
    <div id="input-area">
      <button id="mic-btn" title="Toggle mic" aria-label="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div id="input-wrapper">
        <input
          type="text"
          id="text-input"
          placeholder="Say something to Doraemon..."
          autocomplete="off"
          enterkeyhint="send"
        />
      </div>
      <button id="send-btn" title="Send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
